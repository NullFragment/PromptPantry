<!DOCTYPE html>
<html>
<body>
<!-- Minimal WPRM recipe card (no in-card nutrition) -->
<div class="wprm-recipe-container wprm-recipe">
  <span class="wprm-recipe-name">Kung Pao Beef</span>
  <span class="wprm-recipe-servings" data-servings="4">4</span>
  <span class="wprm-recipe-prep_time-minutes">10</span>
  <span class="wprm-recipe-cook_time-minutes">15</span>
  <ul>
    <li class="wprm-recipe-ingredient">
      <span class="wprm-recipe-ingredient-amount">1</span>
      <span class="wprm-recipe-ingredient-unit">lb</span>
      <span class="wprm-recipe-ingredient-name">beef sirloin</span>
    </li>
  </ul>
  <ul>
    <li class="wprm-recipe-instruction-text">Cook the beef in a hot wok.</li>
  </ul>
</div>

<!-- Nutrition label shortcode rendered separately on the page -->
<div id="recipe-769084-nutrition" class="wprm-nutrition-label-shortcode-container">
  <div class="wprm-nutrition-label-container">
    <span class="wprm-nutrition-label-text-nutrition-container wprm-nutrition-label-text-nutrition-container-calories">
      <span class="wprm-nutrition-label-text-nutrition-label">Calories: </span>
      <span class="wprm-nutrition-label-text-nutrition-value">116</span>
      <span class="wprm-nutrition-label-text-nutrition-unit">kcal</span>
    </span>
    <span class="wprm-nutrition-label-text-nutrition-container wprm-nutrition-label-text-nutrition-container-carbohydrates">
      <span class="wprm-nutrition-label-text-nutrition-label">Carbohydrates: </span>
      <span class="wprm-nutrition-label-text-nutrition-value">10</span>
      <span class="wprm-nutrition-label-text-nutrition-unit">g</span>
    </span>
    <span class="wprm-nutrition-label-text-nutrition-container wprm-nutrition-label-text-nutrition-container-protein">
      <span class="wprm-nutrition-label-text-nutrition-label">Protein: </span>
      <span class="wprm-nutrition-label-text-nutrition-value">5</span>
      <span class="wprm-nutrition-label-text-nutrition-unit">g</span>
    </span>
    <span class="wprm-nutrition-label-text-nutrition-container wprm-nutrition-label-text-nutrition-container-fat">
      <span class="wprm-nutrition-label-text-nutrition-label">Fat: </span>
      <span class="wprm-nutrition-label-text-nutrition-value">6</span>
      <span class="wprm-nutrition-label-text-nutrition-unit">g</span>
    </span>
  </div>
</div>
</body>
</html>
